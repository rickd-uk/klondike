<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Klondike: a fanned pair of cards, ace of spades on top, on green baize -->
  <rect width="64" height="64" rx="10" fill="#008000"/>
  <rect x="14" y="12" width="26" height="36" rx="3" fill="#1e3c72" stroke="#fff" stroke-width="1.5" transform="rotate(-12 27 30)"/>
  <rect x="25" y="16" width="26" height="36" rx="3" fill="#fff" stroke="#444" stroke-width="1.5" transform="rotate(8 38 34)"/>
  <g transform="rotate(8 38 34)">
    <text x="28" y="25" font-family="Georgia, serif" font-size="8" fill="#000">A</text>
    <text x="38" y="41" font-family="Georgia, serif" font-size="16" text-anchor="middle" fill="#000">&#9824;</text>
  </g>
</svg>
